</defs>
<rect width="1920" height="1080" fill="#eef2f7"/>
<g filter="url(#soft)"><ellipse cx="300" cy="200" rx="700" ry="420" fill="#cfe0f5" opacity="0.9"/><ellipse cx="1600" cy="300" rx="620" ry="420" fill="#f3dfe8" opacity="0.85"/><ellipse cx="1000" cy="950" rx="900" ry="360" fill="#dff0ea" opacity="0.9"/></g>

<rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
