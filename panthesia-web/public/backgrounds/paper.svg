<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="120"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0"/></filter>
</defs>
<rect width="1920" height="1080" fill="#f5efe3"/>
<g filter="url(#soft)"><ellipse cx="400" cy="300" rx="800" ry="500" fill="#efe4cf" opacity="0.9"/><ellipse cx="1600" cy="850" rx="700" ry="400" fill="#ebdcc3" opacity="0.8"/></g>

<rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
