[workspace]
members = [
  "panthesia-core",
  "panthesia-engine",
  "panthesia-keyboard",
  "panthesia-music",
  "panthesia-notation",
  "panthesia-vst3",
  "panthesia-web/src-tauri",
]

default-members = ["panthesia-web/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
panthesia-core = { path = "./panthesia-core" }
panthesia-engine = { path = "./panthesia-engine" }
panthesia-keyboard = { path = "./panthesia-keyboard" }
panthesia-music = { path = "./panthesia-music" }
panthesia-notation = { path = "./panthesia-notation" }
panthesia-vst3 = { path = "./panthesia-vst3" }

anyhow = "1"
thiserror = "2.0"
log = "0.4"
bytes = "1"
csv = "1.3"
euclid = "0.22"
dpi = "0.1"
rfd = "0.17"
cpal = { version = "0.18", features = ["realtime"] }
vst3-host = { version = "0.9", default-features = false, features = ["cpal-backend"] }
oxisynth = "0.1.0"
midir = "0.11"
ron = "0.12"
serde = "1"
serde_json = "1"
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
blake3 = "1"
sha2 = "0.10"
windows-sys = "0.61"
profiling = "1.0"
midly = "0.5"
