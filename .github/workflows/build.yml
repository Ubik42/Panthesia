name: Panthesia desktop build
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "product.json"
      - "panthesia-core/**"
      - "panthesia-engine/**"
      - "panthesia-vst3/**"
      - "panthesia-web/**"
      - "panthesia-music/**"
      - "panthesia-keyboard/**"
      - "scripts/build-practice.ps1"
      - "scripts/practice-build.psm1"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "panthesia-*/**"
      - "scripts/build-practice.ps1"
      - "scripts/practice-build.psm1"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panthesia-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build current desktop once
        shell: pwsh
        run: ./scripts/build-practice.ps1 -Target Desktop -Configuration Debug
