name: Prepare Panthesia Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panthesia-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare Release package
        shell: pwsh
        run: ./scripts/package-practice.ps1 -Destination outputs/ci/Panthesia-Windows -Configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: Panthesia-Windows
          path: outputs/ci/Panthesia-Windows
          if-no-files-found: error
